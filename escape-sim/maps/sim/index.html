  window.__isApp=standalone;

    if(dp){ dp.prompt(); try{ await dp.userChoice; }catch(_){} dp=null; return; }
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

    let el=document.getElementById('pwaTip');
    if(!el){ el=document.createElement('div'); el.id='pwaTip'; el.style.cssText='position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,8,20,.55);font-family:inherit';
      el.innerHTML='<div style="background:#fff;color:#1d2733;border-radius:16px;padding:18px 20px;max-width:320px;font-size:14px;line-height:1.7;box-shadow:0 10px 40px rgba(0,0,0,.3)"><div id="pwaMsg"></div><div style="text-align:right;margin-top:10px"><button style="border:none;background:#1f5f8b;color:#fff;border-radius:999px;padding:7px 16px;font-size:13px">확인</button></div></div>';
      el.addEventListener('click',e=>{ if(e.target===el||e.target.tagName==='BUTTON') el.style.display='none'; }); document.body.appendChild(el); }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= Scene ================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
const LOWPOWER = (matchMedia&&matchMedia('(pointer:coarse)').matches) || Math.min(innerWidth,innerHeight)<700 || /[?&]low/.test(location.search);
renderer.setPixelRatio(Math.min(devicePixelRatio, LOWPOWER?1.25:2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = LOWPOWER?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, .3, 800);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minDistance = 8; controls.maxDistance = 220;
controls.addEventListener('start',()=>{ camGoal=null; });
const hemi = new THREE.HemisphereLight(0xc8d6ff, 0x2a2140, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 1.6);
sun.position.set(40,80,30); sun.target.position.set(0,0,-44); sun.castShadow = true;
sun.shadow.mapSize.set(LOWPOWER?1024:2048,LOWPOWER?1024:2048);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:70,bottom:-70,near:1,far:220});
scene.add(sun, sun.target);
const worldRoot = new THREE.Group(); scene.add(worldRoot);

const mat = c => new THREE.MeshStandardMaterial({color:c, roughness:.75});
const M = {
  ground:mat(0x9fb38a), site:mat(0xc9c5bc), road:mat(0x5d6166), line:new THREE.MeshBasicMaterial({color:0xf2f2f2}),
  panel:mat(0xeeeeea), brick:mat(0xa0634a), dark:new THREE.MeshStandardMaterial({color:0x3b4249,roughness:.5,metalness:.4}),
  glass:new THREE.MeshStandardMaterial({color:0x8fb8d0,roughness:.1,transparent:true,opacity:.5}),
  slab:mat(0xd8d8d2), wall:mat(0xf3f1ec), floor:mat(0xcdb994), corridor:mat(0xb9b2a4), core:mat(0xa9b0b6),
  shelf:mat(0x8a6a48), desk:mat(0xf4f1ea), tree:mat(0x5f8a4c), trunk:mat(0x6b4f3a), stair:mat(0x9aa1a8),
  screen:new THREE.MeshStandardMaterial({color:0x223344,emissive:0x2a6fa8,emissiveIntensity:.6}),
  skin:mat(0xf1c9a5), hair:mat(0x2a211c), navy:mat(0x2d3a55), skirt:mat(0x3b4a6b), sock:mat(0x2a2a35)
};

  const o = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);

}
function label(text, w=4, color='#1d2733', bg='rgba(255,255,255,.88)'){
  const c = document.createElement('canvas'); c.width=512; c.height=128;
  const x = c.getContext('2d');
  x.fillStyle=bg; x.beginPath(); x.roundRect(4,14,504,100,40); x.fill();
  x.fillStyle=color; x.font='bold 50px "Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(text,256,66);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false, transparent:true}));
  s.scale.set(w, w/4, 1); s.renderOrder = 10; return s;
}


const glow=(c,i=1)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i});
const mat2=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
function cyl(rt,rb,h,m,x,y,z,par=worldRoot,seg=16){ const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m); o.position.set(x,y+h/2,z); o.castShadow=true; o.receiveShadow=true; par.add(o); return o; }
function ball(r,m,x,y,z,par=worldRoot){ const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m); o.position.set(x,y,z); o.castShadow=true; par.add(o); return o; }
let dseed=7; const DR=()=>{ dseed=(dseed*16807)%2147483647; return dseed/2147483647; }, rr=(a,b)=>a+DR()*(b-a);
const hexNum=c=>typeof c==='number'?c:parseInt(String(c).replace('#',''),16);

/* ================= 카툰 그래픽: 셀 셰이딩 · 잉크 외곽선 · 바닥 액션 존 · 말풍선 아이콘 =================
   기본으로 켜져 있어요. 주소에 ?classic 을 붙이거나 메뉴 → 🎨 그래픽 바꾸기 로 예전 모습으로 돌아갈 수 있어요.
   ?noink 는 외곽선만 끔. */
const TOON = !/[?&]classic/.test(location.search) && (()=>{ try{ return localStorage.getItem('escStyle')!=='classic'; }catch(_){ return true; } })();
const INK = TOON && !/[?&]noink/.test(location.search);
const INK_COLOR = 0x1d1826;
const TOONU = { uGain:{value:1.0}, uSteps:{value:3.0}, uInk:{value:LOWPOWER?.003:.0027} };
if(TOON){
  renderer.toneMapping = THREE.NoToneMapping;
  // 모든 MeshStandardMaterial 의 빛을 몇 단계로 끊어 칠함 (색·투명도·발광은 엔진이 바꾸는 그대로 따라감)
  THREE.MeshStandardMaterial.prototype.onBeforeCompile = function(sh){
    sh.uniforms.uGain=TOONU.uGain; sh.uniforms.uSteps=TOONU.uSteps;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uGain;\nuniform float uSteps;')
      .replace('vec3 outgoingLight = totalDiffuse + totalSpecular + totalEmissiveRadiance;', `
        vec3 _md = max(material.diffuseColor, vec3(.004));
        vec3 _L = totalDiffuse / _md;                       // 이 점에 닿은 빛 (색 포함)
        float _l = max(dot(_L, vec3(.299,.587,.114)), 1e-4);
        float _s = _l * uSteps;
        float _q = (floor(_s) + smoothstep(.42,.58,fract(_s)) + .35) / uSteps;   // 계단식 밝기
        vec3 _tint = mix(vec3(1.), _L/_l, .5);              // 빛 색은 반만 섞어 원래 색을 살림
        float _sp = smoothstep(.62,.68, dot(totalSpecular, vec3(.333)));   // 작은 하이라이트 한 점
        vec3 outgoingLight = diffuseColor.rgb * _tint * _q * uGain + vec3(_sp*.22) + totalEmissiveRadiance;`);
  };
}

/* --- 잉크 외곽선 (뒤집은 껍데기 방식: 화면에서 늘 같은 굵기) --- */
const inkMat = new THREE.MeshBasicMaterial({color:INK_COLOR, side:THREE.BackSide});
inkMat.onBeforeCompile = sh=>{
  sh.uniforms.uInk=TOONU.uInk;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nattribute vec3 inkNormal;\nuniform float uInk;')
    .replace('#include <project_vertex>', `
      vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );
      vec3 _vn = normalize( normalMatrix * inkNormal );
      mvPosition.xyz += _vn * uInk * max( 3.0, -mvPosition.z );
      gl_Position = projectionMatrix * mvPosition;`);
};
function inkNormals(g){
  if(g.attributes.inkNormal) return true;
  const p=g.attributes.position, n=g.attributes.normal;
  if(!p||!n||p.count>8000) return false;
  const idx=new Map(), acc=[], ids=new Int32Array(p.count);
  for(let i=0;i<p.count;i++){
    const k=Math.round(p.getX(i)*500)+'|'+Math.round(p.getY(i)*500)+'|'+Math.round(p.getZ(i)*500);
    let j=idx.get(k); if(j===undefined){ j=acc.length/3; idx.set(k,j); acc.push(0,0,0); }
    ids[i]=j; acc[j*3]+=n.getX(i); acc[j*3+1]+=n.getY(i); acc[j*3+2]+=n.getZ(i);
  }
  const out=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){ const j=ids[i]*3; const l=Math.hypot(acc[j],acc[j+1],acc[j+2])||1; out[i*3]=acc[j]/l; out[i*3+1]=acc[j+1]/l; out[i*3+2]=acc[j+2]/l; }
  g.setAttribute('inkNormal', new THREE.BufferAttribute(out,3));
  return true;
}
const _inkV=new THREE.Vector3();
function applyInk(root, merge=false){
  if(!INK) return;
  root.updateMatrixWorld(true);
  const list=[];
  root.traverse(o=>{
    if(!o.isMesh || o.userData.isInk || o.userData.ink || o.isInstancedMesh) return;
    const m=o.material; if(!m || Array.isArray(m) || !m.isMeshStandardMaterial || m.visible===false) return;
    if(m.transparent || m.opacity<1 || m.side===THREE.DoubleSide || o.userData.noInk) return;
    const g=o.geometry; if(!g || !g.attributes.position) return;
    const t=g.type; if(t==='PlaneGeometry'||t==='RingGeometry'||t==='CircleGeometry'||t==='ShapeGeometry') return;
    if(!g.boundingBox) g.computeBoundingBox();
    g.boundingBox.getSize(_inkV); _inkV.multiply(o.getWorldScale(new THREE.Vector3())); const mn=Math.min(_inkV.x,_inkV.y,_inkV.z), mx=Math.max(_inkV.x,_inkV.y,_inkV.z);
    if(mn<.012 || mx>60) return;   // 납작한 판·아주 큰 땅은 건너뜀
    list.push(o);
  });
  // 움직이지 않는 물체의 외곽선은 하나로 합쳐 한 번에 그림 (휴대폰에서도 가볍게)
  const moving=new Set(); if(merge){ (typeof ANIM!=='undefined'?ANIM:[]).forEach(e=>e.o&&moving.add(e.o)); (typeof roofs!=='undefined'?roofs:[]).forEach(r=>moving.add(r)); }
  const isMoving=o=>{ for(let q=o;q&&q!==root;q=q.parent) if(moving.has(q)) return true; return false; };
  const stat=[];
  for(const o of list){
    if(!inkNormals(o.geometry)) continue;
    if(merge && !isMoving(o)){ stat.push(o); continue; }
    const h=new THREE.Mesh(o.geometry, inkMat);
    h.userData.isInk=true; h.castShadow=false; h.receiveShadow=false; h.raycast=()=>{};
    o.add(h); o.userData.ink=h;
  }
  if(!stat.length) return;
  const nm=new THREE.Matrix3(), v=new THREE.Vector3();
  let P=[], N=[], I=[], base=0;
  const flush=()=>{ if(!I.length) return;
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.setAttribute('inkNormal',new THREE.Float32BufferAttribute(N,3)); g.setIndex(I);
    g.computeBoundingSphere(); const h=new THREE.Mesh(g, inkMat); h.userData.isInk=true; h.raycast=()=>{}; h.matrixAutoUpdate=false; root.add(h);
    P=[]; N=[]; I=[]; base=0; };
  for(const o of stat){
    const g=o.geometry, pa=g.attributes.position, na=g.attributes.inkNormal, mw=o.matrixWorld; nm.getNormalMatrix(mw);
    for(let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(mw); P.push(v.x,v.y,v.z); v.fromBufferAttribute(na,i).applyMatrix3(nm).normalize(); N.push(v.x,v.y,v.z); }
    if(g.index){ const ix=g.index.array; for(let i=0;i<ix.length;i++) I.push(ix[i]+base); } else for(let i=0;i<pa.count;i++) I.push(i+base);
    base+=pa.count; o.userData.ink=true;
    if(base>400000) flush();
  }
  flush();
}

/* --- 캔버스 그리기 도구 (아이콘은 글꼴 없이 직접 그려서 어느 기기에서나 똑같이 보임) --- */
const INK_CSS='#1d1826';
function icon(x, kind, cx, cy, s){
  x.save(); x.translate(cx,cy); x.scale(s/40,s/40); x.lineJoin='round'; x.lineCap='round';
  const stroke=(w=5)=>{ x.lineWidth=w; x.strokeStyle=INK_CSS; x.stroke(); };
  if(kind==='obs'||kind==='search'){ // 돋보기
    x.beginPath(); x.arc(-4,-4,12,0,Math.PI*2); x.fillStyle='#bfe8ff'; x.fill(); stroke(5);
    x.beginPath(); x.moveTo(5,5); x.lineTo(16,16); x.lineWidth=8; x.strokeStyle=INK_CSS; x.stroke(); x.lineWidth=4; x.strokeStyle='#e0a040'; x.stroke();
  } else if(kind==='logic'){ // 퍼즐 조각
    x.beginPath(); x.moveTo(-15,-9); x.lineTo(-4,-9); x.arc(0,-11,5,Math.PI*0.9,Math.PI*2.1); x.lineTo(15,-9); x.lineTo(15,0); x.arc(17,4,5,-Math.PI*0.6,Math.PI*0.6); x.lineTo(15,15); x.lineTo(-15,15); x.closePath();
    x.fillStyle='#ffb84d'; x.fill(); stroke(4.5);
  } else if(kind==='both'||kind==='star'){ // 별
    x.beginPath(); for(let i=0;i<10;i++){ const r=i%2?7.5:17, a=-Math.PI/2+i*Math.PI/5; x.lineTo(Math.cos(a)*r,Math.sin(a)*r+1); } x.closePath();
    x.fillStyle='#ffd23f'; x.fill(); stroke(4.5);
  } else if(kind==='hint'){ // 전구
    x.beginPath(); x.arc(0,-5,12,Math.PI*0.8,Math.PI*2.2); x.lineTo(5,9); x.lineTo(-5,9); x.closePath(); x.fillStyle='#ffe066'; x.fill(); stroke(4.5);
    x.beginPath(); x.moveTo(-5,14); x.lineTo(5,14); stroke(4); x.beginPath(); x.moveTo(-3,-4); x.quadraticCurveTo(0,-11,3,-4); x.lineWidth=2.5; x.strokeStyle='#fff'; x.stroke();
  } else if(kind==='check'){ // 초록 체크
    x.beginPath(); x.moveTo(-13,0); x.lineTo(-4,10); x.lineTo(14,-11); x.lineWidth=10; x.strokeStyle=INK_CSS; x.stroke(); x.lineWidth=5.5; x.strokeStyle='#3ccf6e'; x.stroke();
  } else if(kind==='wait'){ // 모래시계
    x.beginPath(); x.moveTo(-11,-15); x.lineTo(11,-15); x.lineTo(0,0); x.lineTo(11,15); x.lineTo(-11,15); x.lineTo(0,0); x.closePath(); x.fillStyle='#d9f0ff'; x.fill(); stroke(4.5);
    x.beginPath(); x.moveTo(-6,13); x.lineTo(6,13); x.lineTo(0,5); x.closePath(); x.fillStyle='#f2b84b'; x.fill();
  } else if(kind==='angry'){ // 화난 얼굴
    x.beginPath(); x.arc(0,0,17,0,Math.PI*2); const gr=x.createRadialGradient(-5,-6,2,0,0,18); gr.addColorStop(0,'#ffb35c'); gr.addColorStop(1,'#f0592f'); x.fillStyle=gr; x.fill(); stroke(4);
    x.beginPath(); x.moveTo(-11,-8); x.lineTo(-3,-4); x.moveTo(11,-8); x.lineTo(3,-4); stroke(3.5);
    x.fillStyle=INK_CSS; x.beginPath(); x.arc(-6,0,2.4,0,Math.PI*2); x.arc(6,0,2.4,0,Math.PI*2); x.fill();
    x.beginPath(); x.moveTo(-7,10); x.quadraticCurveTo(0,4,7,10); stroke(3.5);
  } else if(kind==='x'){ x.beginPath(); x.moveTo(-11,-11); x.lineTo(11,11); x.moveTo(11,-11); x.lineTo(-11,11); x.lineWidth=10; x.strokeStyle=INK_CSS; x.stroke(); x.lineWidth=5; x.strokeStyle='#ef4b4b'; x.stroke(); }
  else if(kind==='alert'){ x.beginPath(); x.roundRect(-4.5,-17,9,22,4); x.fillStyle='#ffd23f'; x.fill(); stroke(3.5); x.beginPath(); x.arc(0,12,4.5,0,Math.PI*2); x.fill(); stroke(3.5); }
  x.restore();
}

/* --- 바닥 액션 존: 퍼즐 자리 둘레의 둥근 네모 + 흰 모서리 괄호 + 종류 아이콘 --- */
const ZONE_TX={};
function zoneTexture(type, final){
  const k=type+(final?'F':''); if(ZONE_TX[k]) return ZONE_TX[k];
  const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  x.fillStyle='rgba(70,48,30,.30)'; x.beginPath(); x.roundRect(22,22,212,212,46); x.fill();
  x.strokeStyle='#ffffff'; x.lineWidth=11; x.lineCap='round';
  const br=(cx,cy,a)=>{ x.beginPath(); x.arc(cx,cy,38,a,a+Math.PI/2); x.stroke(); };
  br(60,60,Math.PI); br(196,60,-Math.PI/2); br(196,196,0); br(60,196,Math.PI/2);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4;
  return ZONE_TX[k]=t;
}
function badgeTexture(kind){
  const k='b_'+kind; if(ZONE_TX[k]) return ZONE_TX[k];
  const c=document.createElement('canvas'); c.width=c.height=96; const x=c.getContext('2d');
  x.fillStyle='#ffffff'; x.beginPath(); x.arc(48,48,40,0,Math.PI*2); x.fill(); x.lineWidth=6; x.strokeStyle=INK_CSS; x.stroke();
  icon(x, kind, 48, 48, 50);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return ZONE_TX[k]=t;
}
function actionZone(st){
  const flat=o=>({transparent:true, depthWrite:false, polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4, toneMapped:false, ...o});
  const g=new THREE.Group(); g.position.set(st.x, st.room.y+.06, st.z+.25);
  const base=new THREE.Mesh(new THREE.PlaneGeometry(3.6,3.6), new THREE.MeshBasicMaterial(flat({map:zoneTexture(st.type, st.room.final)})));
  base.rotation.x=-Math.PI/2; base.renderOrder=2; base.raycast=()=>{}; g.add(base);
  const badge=new THREE.Mesh(new THREE.PlaneGeometry(.95,.95), new THREE.MeshBasicMaterial(flat({map:badgeTexture(st.room.final?'star':st.type), polygonOffsetFactor:-6, polygonOffsetUnits:-6})));
  badge.rotation.x=-Math.PI/2; badge.position.set(0,.01,1.42); badge.renderOrder=3; badge.raycast=()=>{}; g.add(badge);
  g.userData.base=base; return g;
}

/* --- 캐릭터 말풍선 아이콘 --- */
function makeBubble(){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false, transparent:true, toneMapped:false}));
  s.scale.set(.9,.9,1); s.position.y=2.25; s.renderOrder=12; s.visible=false; s.userData={c,t,key:''}; s.raycast=()=>{};
  return s;
}
function drawBubble(s, kind, prog, col){
  const x=s.userData.c.getContext('2d'); x.clearRect(0,0,128,128);
  // 말풍선 몸통 + 꼬리
  x.beginPath(); x.arc(64,56,46,Math.PI*0.62,Math.PI*0.38+Math.PI*2); x.lineTo(64,118); x.closePath();
  x.fillStyle='#ffffff'; x.fill(); x.lineWidth=6; x.strokeStyle=INK_CSS; x.lineJoin='round'; x.stroke();
  if(prog!=null){ // 진행 링 (게임 캡처의 초록 링)
    x.beginPath(); x.arc(64,56,36,0,Math.PI*2); x.lineWidth=11; x.strokeStyle='#2b2a3a'; x.stroke();
    x.beginPath(); x.arc(64,56,36,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(.02,prog)); x.strokeStyle=col||'#3ccf6e'; x.lineCap='round'; x.stroke(); x.lineCap='butt';
    icon(x, kind, 64, 56, 40);
  } else icon(x, kind, 64, 56, 54);
  s.userData.t.needsUpdate=true;
}
function bubbleKind(a){
  const t=a.team;
  if(a.jump!==undefined && clock-a.jump<18) return ['check'];
  if(t.state==='escaped') return (clock-(t.finish??clock)<45) ? ['star'] : null;
  if(t.state==='failed') return ['x'];
  if(t.state==='solving'){
    const st=t.station; if(!st) return null;
    if(t.lastHint!=null && clock-t.lastHint<20 && a.room===st.room.id) return ['hint'];
    if(a.room!==st.room.id) return null;
    const near=Math.hypot(a.x-st.x,a.z-st.z)<2.2;
    if(near) return [st.room.final?'star':st.type, Math.floor(Math.min(1,t.progress)*24)/24];
    return a.act==='방 수색 중' ? ['search'] : null;
  }
  if(t.state==='waiting'){
    const w=clock-(t.waitStart??clock), i=t.members.indexOf(a);
    if(w>50 && i<2) return ['angry'];
    return (i%2===0) ? ['wait'] : null;
  }
  if(t.state==='moving' && clock-(t.moveStart??-99)<6 && t.members[0]===a) return ['alert'];
  return null;
}
function updateBubbles(){
  if(!TOON) return;
  for(const a of agents){
    const s=a.bubble; if(!s) continue;
    if(window.__spritesOff || !a.mesh.visible){ s.visible=false; continue; }
    const k=bubbleKind(a);
    if(!k){ s.visible=false; continue; }
    const key=k.join(':');
    if(key!==s.userData.key){ s.userData.key=key; drawBubble(s,k[0],k.length>1?k[1]:null); }
    const d=camera.position.distanceTo(a.mesh.position), sc=Math.min(3.6,Math.max(.95,d*.038)); s.scale.set(sc,sc,1); s.position.y=1.75+sc*.55;
    s.visible=true;
  }
}
function updateZones(t){
  if(!TOON) return;
  for(const st of stations){ const z=st.zone; if(!z) continue;
    const b=z.userData.base;
    if(st.busy){ b.material.color.set(st.busy.color); b.scale.setScalar(1+.035*Math.sin(t*5)); }
    else { b.material.color.set(0xffffff); b.scale.setScalar(1); }
  }
}

/* ================= 맵 (maps/*.json 에서 불러옴) ================= */
let MAP=null, PLANETS=[], BRIDGES=[], PL={}, CHAR_GLOW=.2;
const BW=2.6;
function disposeTree(o){ o.traverse(c=>{ if(c.geometry) c.geometry.dispose(); if(c.material){ if(c.material.map) c.material.map.dispose(); c.material.dispose&&c.material.dispose(); } }); }

function buildTheme(th){
  scene.background=new THREE.Color(hexNum(th.bg));
  scene.fog=new THREE.Fog(hexNum(th.bg), th.fog?.[0]??120, th.fog?.[1]??260);
  hemi.color.set(hexNum(th.hemi?.[0]??'#c8d6ff')); hemi.groundColor.set(hexNum(th.hemi?.[1]??'#2a2140')); hemi.intensity=th.hemi?.[2]??1;
  sun.intensity=th.sun??1.6; sun.color.set(hexNum(th.sunColor??'#fff0d8'));
  if(th.stars){ const n=th.stars, pos=new Float32Array(n*3);
    for(let i=0;i<n;i++){ const u=Math.random()*.95+(th.ground?0.05:-1)*(th.ground?1:0)+ (th.ground?0:Math.random()*0), th2=Math.random()*Math.PI*2, Rr=320+Math.random()*60;
      const uu=th.ground? Math.random()*.9+.08 : Math.random()*2-1, s=Math.sqrt(1-uu*uu);
      pos[i*3]=Rr*s*Math.cos(th2); pos[i*3+1]=Rr*uu*.9+(th.ground?0:30); pos[i*3+2]=Rr*s*Math.sin(th2)-44; }

    worldRoot.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false,fog:false}))); }
  (th.farPlanets||[]).forEach(([x,y,z,r,c])=>{
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,20),new THREE.MeshStandardMaterial({color:hexNum(c),roughness:.8,emissive:hexNum(c),emissiveIntensity:.15,fog:false}));
    m.position.set(x,y,z); worldRoot.add(m); });
  if(th.moon){ const m=new THREE.Mesh(new THREE.SphereGeometry(th.moon[3],32,20),new THREE.MeshBasicMaterial({color:hexNum(th.moon[4]||'#fff3c8'),fog:false})); m.position.set(th.moon[0],th.moon[1],th.moon[2]); worldRoot.add(m); }
  if(th.ground){ const gm=new THREE.Mesh(new THREE.CircleGeometry(260,64),mat2(hexNum(th.ground))); gm.rotation.x=-Math.PI/2; gm.position.set(0,-.62,-44); gm.receiveShadow=true; worldRoot.add(gm);

function makePlanet(p){

  if((MAP.islandStyle||'float')==='float'){

    const rock=new THREE.Mesh(new THREE.ConeGeometry(p.r*.92,p.r*1.3,24),mat2(p.rock,{flatShading:true})); rock.rotation.x=Math.PI; rock.position.y=-1-p.r*.65; g.add(rock);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(p.r+.05,.07,8,64),glow(0xffe9a8,.9)); rim.rotation.x=Math.PI/2; rim.position.y=.02; g.add(rim);
  } else { // terrace: 땅에서 솟은 단
    const h=p.y+.62;
    const col=new THREE.Mesh(new THREE.CylinderGeometry(p.r+.25,p.r+.45,h,48),mat2(p.rock)); col.position.y=-h/2; col.receiveShadow=true; col.castShadow=true; g.add(col);
    const top=new THREE.Mesh(new THREE.CylinderGeometry(p.r,p.r,.08,48),mat2(p.top)); top.position.y=-.03; top.receiveShadow=true; g.add(top);

const bridgeSegs=[];
function makeBridge(a,b){
  const A=PL[a], B=PL[b], style=MAP.bridgeStyle||'star';
  const dx=B.x-A.x, dz=B.z-A.z, L=Math.hypot(dx,dz), ux=dx/L, uz=dz/L;
  const sx=A.x+ux*(A.r-.6), sz=A.z+uz*(A.r-.6), ex=B.x-ux*(B.r-.6), ez=B.z-uz*(B.r-.6);
  const seg={ax:sx,az:sz,ay:A.y,bx:ex,bz:ez,by:B.y,ux,uz,len:Math.hypot(ex-sx,ez-sz),from:a,to:b};
  bridgeSegs.push(seg);
  const len3=Math.hypot(seg.len,B.y-A.y);

  }
}

let adj={};
function initNav(){
  adj={}; PLANETS.forEach(p=>adj[p.id]=[]);
  for(const s of bridgeSegs){
    const S={x:s.ax,z:s.az,f:s.ay,room:s.from}, E={x:s.bx,z:s.bz,f:s.by,room:s.to};
    const v = s.ain ? [{x:s.ain.x,z:s.ain.z,f:s.ay,room:s.from},S,E,{x:s.bin.x,z:s.bin.z,f:s.by,room:s.to}] : [S,E];
    adj[s.from].push({to:s.to,via:v,len:s.len}); adj[s.to].push({to:s.from,via:v.slice().reverse(),len:s.len});
  }
}
function route(from,to){
  const dist={[from]:0}, prev={}, q=new Set(Object.keys(adj));
  while(q.size){ let u=null; for(const k of q) if(dist[k]!==undefined&&(u===null||dist[k]<dist[u])) u=k;
    if(u===null||u===to) break; q.delete(u);
    for(const e of adj[u]){ const nd=dist[u]+e.len+10; if(dist[e.to]===undefined||nd<dist[e.to]){ dist[e.to]=nd; prev[e.to]={u,via:e.via}; } } }
  const out=[]; let c=to; while(c!==from){ const pr=prev[c]; if(!pr) return []; out.unshift(...pr.via); c=pr.u; } return out;
}
function onPlanet(a,p){ return Math.hypot(a.x-p.x,a.z-p.z)<=p.r-.2 && Math.abs(a.f-p.y)<.6; }
function goTo(a, roomId, pt){
  const cur=roomById[a.cur]||roomById.lobby, pts=[];
  if(!onPlanet(a,cur) && a.lastWp) pts.push(a.lastWp);           // 다리 위에서 돌아서기
  if(a.cur!==roomId) pts.push(...route(a.cur,roomId));
  pts.push({...pt,room:roomId});
  a.path=pts; a.room=(a.cur===roomId && onPlanet(a,cur))?roomId:null; a.dest=roomId;
}
function randInRoom(r){ const ang=rnd(0,Math.PI*2), d=rnd(1,r.r-1.4); return {x:r.x+Math.cos(ang)*d, z:r.z+Math.sin(ang)*d, f:r.y}; }
function stepAgent(a,dt){
  if(a.path.length){
    const t=a.path[0];
    const dx=t.x-a.x, dz=t.z-a.z, df=(t.f-a.f);
    const dist=Math.hypot(dx,dz,df);
    const sp=a.speed*1.6*(a.team.state==='escaped'?1.2:1)*dt;
    if(dist<=sp){ a.x=t.x; a.z=t.z; a.f=t.f; a.path.shift(); if(t.room){ a.cur=t.room; a.lastWp=t; }
      if(!a.path.length) a.room=a.dest;
    } else { a.x+=dx/dist*sp; a.z+=dz/dist*sp; a.f+=df/dist*sp; if(Math.abs(dx)+Math.abs(dz)>.01) a.yaw=Math.atan2(dx,dz); }
    a.walking=true;
  } else a.walking=false;
}
function separate(){
  for(let i=0;i<agents.length;i++) for(let j=i+1;j<agents.length;j++){
    const a=agents[i], b=agents[j];
    if(Math.abs(a.f-b.f)>.3 || !a.room || !b.room) continue;
    const dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz);
    if(d>0 && d<.55){ const p=(.55-d)*.25; a.x-=dx/d*p; a.z-=dz/d*p; b.x+=dx/d*p; b.z+=dz/d*p; }
  }
  agents.forEach(a=>{ if(a.room){ const r=roomById[a.room];
    if(isTown()||isStack()){ const h=bHalf(r)-.45; a.x=Math.min(r.x+h,Math.max(r.x-h,a.x)); a.z=Math.min(r.z+h,Math.max(r.z-h,a.z)); }
    else { const dx=a.x-r.x, dz=a.z-r.z, d=Math.hypot(dx,dz), m=r.r-.5; if(d>m){ a.x=r.x+dx/d*m; a.z=r.z+dz/d*m; } } } });
}

const BOYS=['민준','서준','도윤','하준','지호','준우','현우','시우','지훈','건우'];
const GIRLS=['서연','지우','하은','민서','수아','지아','채원','윤서','다은','예린'];

const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1)-0xAC00; return w+((c>=0&&c%28)?a:b);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let SEED=2026, R=mulberry32(SEED);
const rnd=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(R()*a.length)];

const agentRoot = new THREE.Group(); scene.add(agentRoot);
let agents=[], teams=[];

function makeBody(a){
  const gr=new THREE.Group();
  const shirt=mat(a.team.color); shirt.emissive.set(a.team.color); shirt.emissiveIntensity=CHAR_GLOW;
  const legs=[];
  for(const sx of [-.09,.09]){
    const p=new THREE.Group(); p.position.set(sx,.78,0);
    box(.13,.74,.15, a.gender==='M'?M.navy:M.sock, 0,-.37,0,p,false); gr.add(p); legs.push(p);
  }
  if(a.gender==='F'){ const sk=new THREE.Mesh(new THREE.CylinderGeometry(.17,.29,.36,10),M.skirt); sk.position.y=.8; gr.add(sk); }
  else box(.34,.16,.2,M.navy,0,.82,0,gr,false);
  box(.4,.52,.24,shirt,0,1.12,0,gr);
  const arms=[];
  for(const sx of [-.26,.26]){ const p=new THREE.Group(); p.position.set(sx,1.36,0); box(.1,.5,.12,shirt,0,-.25,0,p,false); gr.add(p); arms.push(p); }
  const head=new THREE.Mesh(new THREE.SphereGeometry(.15,14,10),M.skin); head.position.y=1.55; gr.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.165,14,10,0,Math.PI*2,0,Math.PI*.55),M.hair); hair.position.y=1.57; gr.add(hair);
  if(a.gender==='F') box(.3,.36,.09,M.hair,0,1.42,-.11,gr,false);
  const ring=new THREE.Mesh(new THREE.RingGeometry(.25,.34,20),new THREE.MeshBasicMaterial({color:a.team.color,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.y=.03; gr.add(ring);
  gr.traverse(o=>{ if(o.isMesh) o.userData.agent=a; });
  a.mesh=gr; a.legs=legs; a.arms=arms; a.ring=ring;
  if(TOON){ applyInk(gr); a.bubble=makeBubble(); gr.add(a.bubble); }
  agentRoot.add(gr);
}

function newGame(seed){
  if(seed!==undefined) SEED=seed;
  R=mulberry32(SEED); acc=0;
  agents.forEach(a=>agentRoot.remove(a.mesh));
  teams.forEach(t=>t.tag&&agentRoot.remove(t.tag));
  stations.forEach(s=>{ s.busy=null; s.done=[]; s.top.color.set(0x9a9a9a); s.top.emissive.set(0); s.bg.visible=s.fill.visible=false; });
  agents=[]; teams=[];
  const bs=shuffle(BOYS.slice()), gs=shuffle(GIRLS.slice());
  TEAMS.forEach((T,ti)=>{
    const team={...T, idx:ti, members:[], clues:0, need:{...NEED}, solved:new Set(), state:'ready', station:null, progress:0, elapsed:0, dur:0, hints:0, finish:null, retry:0, waitF:null, minuteMark:0, waitStart:null, waitTotal:0, hintsHere:0, record:[], tagText:'', wrong:0, wrongHere:0, penalty:0, cards:[], delayUntil:null};
    const nb = ti<2?3:2;
    const names=[...bs.splice(0,nb).map(n=>[n,'M']), ...gs.splice(0,5-nb).map(n=>[n,'F'])];
    names.forEach(([name,gender])=>{
      const a={name,gender,team,obs:ri(1,5),logic:ri(1,5),coop:ri(2,5),speed:rnd(.45,.62),
        x:(PL.lobby?PL.lobby.x:0)+rnd(-5,5),z:(PL.lobby?PL.lobby.z:0)+rnd(-2,6),f:(PL.lobby?PL.lobby.y:0),room:'lobby',cur:'lobby',lastWp:null,node:null,path:[],think:0,phase:rnd(0,6),contrib:0,yaw:0,act:'대기'};
      makeBody(a); team.members.push(a); agents.push(a);
    });
    team.tag=label(team.name,3.2,'#ffffff',team.css); agentRoot.add(team.tag);
    teams.push(team);
  });
  clock=0; running=false; ended=false; endReason=''; histSaved=false; logs.length=0; events.length=0;
  metReset(); jrReset(); if(heatOn) setHeat(true);
  document.getElementById('seed').textContent=SEED;
  playBtn.textContent='▶'; playBtn.classList.add('go');
  document.getElementById('result').style.display='none';
  hideWho();
  ev('setup',null,`20명이 ${roomById.lobby.name}에 모였어요. ▶ 시작을 누르세요.`,
    teams.map(t=>`${t.name}: `+t.members.map(m=>`${m.name}(${m.gender==='M'?'남':'여'}, 관찰${m.obs}·논리${m.logic}·협동${m.coop})`).join(', ')).join(' / '));
  renderTeams();
}

/* ================= Movement ================= */
/* ================= Game logic ================= */
let clock=0, running=false, ended=false, speed=1, acc=0;
const GS_PER_S=6;
const fmt=s=>{s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const logs=[], events=[]; let endReason='', histSaved=false;
function log(text,css){ logs.unshift({t:fmt(clock),text,css}); if(logs.length>40) logs.pop(); renderLog(); }
function ev(type,team,text,detail=''){ events.push({sec:clock,t:fmt(clock),type,team:team?team.name:'',text,detail}); log(text,team?team.css:undefined); }

function targetFloor(t){ return TIER_IDX().find(f=>t.need[f]>0); }
function stationSlot(st,i,n){ const ang=(i/n)*Math.PI*2+.4; return {x:st.x+Math.cos(ang)*1.05, z:st.z+Math.sin(ang)*1.05, f:st.room.y}; }

function decide(t){
  const tf=targetFloor(t);
  let cands;
  if(tf===undefined) cands=stations.filter(s=>s.room.final && !s.busy);
  else cands=stations.filter(s=>s.room.f===tf && !s.room.final && !s.busy && !t.solved.has(s.room.id));
  if(cands.length){
    const ref=t.members[0];
    const sc=cands.map((c,i)=>({c,i,v:Math.hypot(c.x-ref.x,c.z-ref.z)+rnd(-3,3)}));
    sc.sort((a,b)=>a.v-b.v||a.i-b.i);
    const st=sc[0].c;
    if(t.waitStart!==null){ const w=clock-t.waitStart; t.waitTotal+=w; ev('waitEnd',t,`${t.name} 대기 끝 (${fmt(w)} 기다림) → 자리가 났어요`); jr(t,{k:'wait',room:(roomById[t.waitRoom]||roomById.lobby).name,w}); t.waitStart=null; }
    st.busy=t; t.station=st; t.state='moving'; t.waitF=null; t.hintsHere=0; t.moveStart=clock;
    st.top.color.set(t.color); st.top.emissive.set(t.color); st.top.emissiveIntensity=.5;
    t.members.forEach((m,i)=>{ goTo(m, st.room.id, stationSlot(st,i,5)); m.act=`${st.room.name}로 이동`; });
    ev('go',t,`${t.name} → ${st.room.final?'':tierName(st.room.f)+' '}${st.room.name} '${st.puzzle}' 도전`, PUZ[st.puzzle].desc);
    t.tierChange = MET ? (MET.lastF[t.idx]!==null && MET.lastF[t.idx]!==st.room.f) : false; metTier(t,st); jr(t,{k:'go',s:clock,room:st.room.name,puzzle:st.puzzle}); t.delayUntil=null; t.wrongHere=0;
  } else {
    const wf = tf===undefined?'final':tf;
    if(t.waitF!==wf){
      t.waitF=wf; t.state='waiting'; if(t.waitStart===null) t.waitStart=clock;
      t.waitWhy = tf===undefined?`${roomById.vault.short} ${SCN.finalThing} 2개를 다른 팀이 모두 사용 중`:tierName(wf)+'의 남은 퍼즐을 다른 팀이 모두 사용 중';
      const wr=roomById[t.members[0].cur]||roomById.lobby; t.waitRoom=wr.id;
      t.members.forEach(m=>{ goTo(m,wr.id,randInRoom(wr)); m.act=`${wr.short}에서 대기`; });
      const occ=stations.filter(s=>(tf===undefined?s.room.final:(s.room.f===wf&&!s.room.final&&!t.solved.has(s.room.id)))&&s.busy).map(s=>`${s.room.name} ${s.puzzle}(${s.busy.name})`).join(', ');
      ev('wait',t,`${t.name}: ${t.waitWhy} → ${roomById[t.waitRoom].short}에서 대기`, '사용 중: '+occ);
    }
    t.state='waiting'; t.retry=clock+8;
  }
}

function pickBy(t,key){ // weighted pick of member by skill
  const arr=t.members; const tot=arr.reduce((s,m)=>s+(key==='both'?m.obs+m.logic:m[key]),0);
  let r=R()*tot; for(const m of arr){ r-=(key==='both'?m.obs+m.logic:m[key]); if(r<=0) return m; } return arr[0];
}

function updateTeam(t,dt){
  if(t.state==='ready') return decide(t);
  if(t.state==='waiting'){
    if(clock>=t.retry){ decide(t); if(t.state!=='waiting') return; }
    t.members.forEach(m=>{ if(!m.path.length && clock>m.think && m.room===t.waitRoom){ m.think=clock+rnd(8,20);
      goTo(m,t.waitRoom,randInRoom(roomById[t.waitRoom])); m.act=pick(['대기 (서성임)',`대기 (${SCN.clue} 정리)`,'대기 (작전 회의)']); } });
    return;
  }
  if(t.state==='moving'){
    const st=t.station;
    const here=t.members.filter(m=>m.room===st.room.id).length;
    if(here>=4 && (FUN.searchDelay>0||FUN.tierMove>0) && t.delayUntil===null){
      const tier=(FUN.tierMove>0 && t.lastStF!==undefined && t.lastStF!==st.room.f);
      const d=(FUN.searchDelay>0?FUN.searchDelay*rnd(.5,1.5):0)+(tier?FUN.tierMove*rnd(.75,1.5):0);
      t.delayUntil=clock+d; t.lastStF=st.room.f;
      t.members.forEach(m=>m.act=tier?`${josa(W_('link'),'을','를')} 건너와 숨 고르는 중`:'주변 탐색 중');
      ev('delay',t,`${t.name} ${st.room.name}에서 ${tier?'층간 이동·':''}탐색 ${Math.round(d)}초`, tier?`층간 이동 포함 (단계 바뀜)`:'퍼즐 대를 찾느라 시작이 늦어짐');
      jr(t,{k:'delay',room:st.room.name,tier});
      return;
    }
    if(here>=4 && t.delayUntil!==null && clock<t.delayUntil) return;
    if(here>=4){
      t.state='solving'; t.progress=0; t.elapsed=0; t.minuteMark=0;
      t.dur=(st.room.final?7.5:6.8)*rnd(.8,1.6); if(FUN.durScale!==1) t.dur*=FUN.durScale;
      st.bg.visible=st.fill.visible=true; st.fillMat.color.set(t.color);
      t.members.forEach(m=>m.act=`${SCN.clue} 찾는 중`);
      const pres=t.members.filter(m=>m.room===st.room.id).map(m=>m.name);
      ev('start',t,`${t.name} ${st.room.name} '${st.puzzle}' 풀이 시작 (${pres.length}명 도착)`, `도착: ${pres.join(', ')} · 이동 ${fmt(clock-t.moveStart)}`);
      t.solveStart=clock;
    }
    return;
  }
  if(t.state==='solving'){
    const st=t.station, key=st.type;
    const present=t.members.filter(m=>m.room===st.room.id);
    const sk=present.reduce((s,m)=>s+(key==='both'?(m.obs+m.logic)/2:m[key]),0)/15;
    const coop=present.reduce((s,m)=>s+m.coop,0)/Math.max(1,present.length);
    const power=sk*(1+.06*(coop-3.5));
    t.progress+=power*dt/(t.dur*60); t.elapsed+=dt;
    // 1분마다 이벤트 판정
    if(t.elapsed-t.minuteMark>=60){
      t.minuteMark+=60;
      if(R()<.22){ const m=pickBy(t,key); m.contrib++; const g=rnd(.08,.15); t.progress+=g; ev('idea',t,`${josa(m.name,'이가','가')} ${pick(IDEAS[key])} → 진행 +${Math.round(g*100)}%`, `${st.puzzle} 진행률 ${Math.round(Math.min(1,t.progress)*100)}%`); }
      if(t.elapsed>t.dur*60*.7 && t.progress<.7 && t.hints<3){ t.hints++; t.lastHint=clock; const h=PUZ[st.puzzle].hints[Math.min(2,t.hintsHere++)];
        const gain=FUN.timeTrade?FUN.tradeBonus:.2; t.progress+=gain; if(FUN.timeTrade) t.penalty+=FUN.tradeCost;
        ev('hint',t,`${t.name} 힌트 요청 (${t.hints}/3): "${h}"`, `${st.puzzle} — 풀이 ${fmt(t.elapsed)} 경과, 진행률 ${Math.round((t.progress-gain)*100)}%에서 요청`+(FUN.timeTrade?` · 시간 거래: 진행 +${Math.round(gain*100)}%, 기록 +${fmt(FUN.tradeCost)}`:''));
        metCount('hint',t,st.puzzle); jr(t,{k:'hint',trade:FUN.timeTrade}); }
    }
    st.fill.scale.x=Math.max(.01,Math.min(1,t.progress)); st.fill.position.x=-(1-st.fill.scale.x)/2;
    if(t.progress>=1 && FUN.wrongRate>0 && t.wrongHere<2 && R()<FUN.wrongRate){
      t.wrong++; t.wrongHere++; const back=rnd(.55,.75); t.progress=back; metCount('wrong',t,st.puzzle); jr(t,{k:'wrong'});
      ev('wrong',t,`${t.name} '${st.puzzle}' 오답! 진행률 ${Math.round(back*100)}%로 돌아가 다시 풀어요`, `오답 ${t.wrong}번째 (이 퍼즐 ${t.wrongHere}번째)`);
      return;
    }
    if(t.progress>=1){
      const finder=pickBy(t,key); finder.contrib+=2; finder.jump=clock;
      t.record.push({room:st.room.name,f:st.room.f+1,puzzle:st.puzzle,start:t.solveStart,end:clock,finder:finder.name,hints:t.hintsHere});
      st.busy=null; st.bg.visible=st.fill.visible=false; st.done.push(t);
      st.top.emissive.set(0); st.top.color.set(0x5d6d7e);
      if(st.room.final){
        t.state='escaped'; t.finish=clock+(t.penalty||0); t.clues++;
        if(t.penalty && t.finish>LIMIT){ t.finish=null; t.state='failed';
          ev('fail',t,`${t.name} ${st.puzzle}은 풀었지만 시간 거래(+${fmt(t.penalty)})로 기록이 제한 시간을 넘었어요`,`실제 ${fmt(clock)} + 시간 거래 ${fmt(t.penalty)}`);
          t.members.forEach(m=>{ goTo(m,'lobby',randInRoom(roomById.lobby)); m.act='시간 초과'; }); checkEnd(); return; }
        const rank=t.penalty?teams.filter(x=>x.finish!==null&&x.finish<=t.finish).length:teams.filter(x=>x.finish!==null).length;
        jr(t,{k:'escape',s:clock,finder:finder.name,puzzle:st.puzzle});
        ev('escape',t,`${DONE_ICON()} ${t.name} ${DONE()}! ${rank}위 · 기록 ${fmt(t.finish)}${t.penalty?` (시간 거래 +${fmt(t.penalty)} 포함)`:''}`, `${josa(finder.name,'이가','가')} '${st.puzzle}' 해결 (정답: ${PUZ[st.puzzle].answer}) · 풀이 ${fmt(clock-t.solveStart)}`);
        const lobby=roomById.lobby;
        t.members.forEach(m=>{ goTo(m,'lobby',randInRoom(lobby)); m.act=DONE()+'!'; });
        checkEnd();
      } else {
        t.clues++; t.need[st.room.f]--; t.solved.add(st.room.id); t.state='ready'; t.station=null;
        const card=cardOf(st.room.id); if(card) t.cards.push(st.room.id); jr(t,{k:'solve',finder:finder.name,n:t.clues,card});
        ev('solve',t,`${t.name} ${SCN.clue} ${t.clues}/${TOTAL()} — ${josa(finder.name,'이가','가')} '${st.puzzle}' 해결`, `정답: ${PUZ[st.puzzle].answer} · 풀이 ${fmt(clock-t.solveStart)} · 이 퍼즐 힌트 ${t.hintsHere}개`);
      }
      return;
    }
    // 멤버 행동: 일부는 퍼즐 앞, 일부는 방 수색
    t.members.forEach((m,i)=>{
      if(m.room===st.room.id && !m.path.length && clock>m.think){
        m.think=clock+rnd(15,45);
        if(R()<.5){ goTo(m,st.room.id,stationSlot(st,i,5)); m.act='퍼즐 푸는 중'; }
        else { goTo(m,st.room.id,randInRoom(st.room)); m.act='방 수색 중'; }
      }
    });
  }
  if(t.state==='escaped'){
    t.members.forEach(m=>{ if(m.room==='lobby' && !m.path.length && clock>m.think){ m.think=clock+rnd(10,30); goTo(m,'lobby',randInRoom(roomById.lobby)); } });
  }
}

function checkEnd(){
  if(ended) return;
  const allOut=teams.every(t=>t.state==='escaped'||(t.penalty&&t.state==='failed'));
  if(allOut || clock>=LIMIT){
    ended=true; running=false; playBtn.textContent='▶'; playBtn.classList.add('go');
    teams.forEach(t=>{ if(t.state!=='escaped' && t.state==='solving') ev('fail',t,`${t.name} 미완료: '${t.station.puzzle}' 진행률 ${Math.round(t.progress*100)}%에서 시간 종료`,`${SCN.clue} ${t.clues}/${TOTAL()} · 힌트 ${t.hints}/3 사용 · 대기 ${fmt(t.waitTotal)}`); });
    teams.forEach(t=>{ if(t.state!=='escaped'){ t.state='failed'; if(t.station){ t.station.busy=null; t.station.bg.visible=t.station.fill.visible=false; t.station.top.emissive.set(0);} t.members.forEach(m=>m.act='시간 초과'); } });
    endReason = allOut ? (teams.every(t=>t.state==='escaped') ? `4팀 모두 ${DONE()}, ${fmt(clock)}에 게임 종료` : `모든 팀이 끝나 ${fmt(clock)}에 게임 종료 (시간 거래로 기록 초과: ${teams.filter(t=>t.state==='failed').map(t=>t.name).join(', ')})`) : `제한시간 60분이 끝나 게임 종료 (미완료: ${teams.filter(t=>t.state==='failed').map(t=>t.name).join(', ')})`;
    ev('end',null,(allOut?'🎉 ':'⏰ ')+endReason);
    showResult();
  }
}

function tickSim(dt){
  clock+=dt;
  teams.forEach(t=>updateTeam(t,dt));
  agents.forEach(a=>stepAgent(a,dt));
  separate();
  metTick(dt);
  if(clock>=LIMIT) checkEnd();
}


/* ================= 재미 설정·지표 (시나리오 schema 2의 opts가 있을 때만 켜짐, 지금은 어린왕자편) =================
   원칙: 값이 기본(0·false·보통)이면 난수를 하나도 더 쓰지 않아 예전과 결과가 똑같음.
   P0-2 오답·탐색 지연·층간 이동 / P0-3 지표 CSV / P0-4 schema·기본값 / P1-1 여행 일지 / P1-2 엔딩 / P1-3 히트맵
   A2 시간 거래 / A7 난이도 / A8 오늘의 시드 / B5 별 카드 도감 */
const FUN_DEF={difficulty:'normal', wrongRate:0, searchDelay:0, tierMove:0, durScale:1, timeTrade:false, tradeBonus:.35, tradeCost:90,
  journal:false, endings:null, heatmap:false, metrics:false, starCards:null, cardName:'카드', cardIcon:'⭐', endLabels:null, daily:false, stuckWait:.25};
const FUN_PRESETS={ easy:{label:'쉬움', durScale:.85, wrongRate:0, searchDelay:0, tierMove:0},
  normal:{label:'보통 (기존과 같음)'},
  hard:{label:'어려움', durScale:1.1, wrongRate:.2, searchDelay:20, tierMove:20} };
let FUN={...FUN_DEF}, FUN_ON=false, SCN_SCHEMA=1;
const funKey=()=>'escFun:'+((SCN&&SCN.id)||'');
function loadFun(){
  SCN_SCHEMA=(SCN&&SCN.schema)||1;
  FUN={...FUN_DEF}; FUN_ON=!!(SCN&&SCN.opts);
  if(!FUN_ON) return;
  if(SCN_SCHEMA>2) console.warn('이 시나리오는 더 새로운 형식(schema '+SCN_SCHEMA+')이에요. 아는 설정만 씁니다.');
  for(const k of Object.keys(FUN_DEF)) if(SCN.opts[k]!==undefined) FUN[k]=SCN.opts[k];   // 빠진 값은 기본값
  const u=LS.get(funKey(),null);
  if(u){ for(const k of ['difficulty','timeTrade','journal','heatmap','metrics']) if(u[k]!==undefined) FUN[k]=u[k];
    if(u.starCards===false) FUN.starCards=null; if(u.endings===false) FUN.endings=null; }
  if(FUN.difficulty!=='normal'){ const p=FUN_PRESETS[FUN.difficulty]; if(p) for(const k of ['durScale','wrongRate','searchDelay','tierMove']) if(p[k]!==undefined) FUN[k]=p[k]; }
}
const simChanged=()=>FUN.wrongRate>0||FUN.searchDelay>0||FUN.tierMove>0||FUN.durScale!==1||FUN.timeTrade;

/* P0-1 순환 의존·막힘 검사: 단계마다 장소 수 ≥ 필요한 단서 수, 모든 장소가 출발점과 이어짐, 최종 장소에 퍼즐 대 */
function validateScenario(){
  const issues=[];
  NEEDS.forEach((n,f)=>{ const rs=ROOMS.filter(r=>r.f===f&&!r.final&&(r.puzzles||[]).length); if(rs.length<n) issues.push(`${tierName(f)}: 필요한 단서 ${n}개인데 퍼즐 장소가 ${rs.length}곳뿐`); });
  const fin=ROOMS.find(r=>r.final); if(!fin||!(fin.puzzles||[]).length) issues.push('최종 장소에 퍼즐 대가 없음');
  if(!roomById.lobby) issues.push('출발 장소(lobby)가 없음');
  const adj={}; (MAP.bridges||[]).forEach(([a,b])=>{ (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); });
  const seen=new Set(['lobby']), q=['lobby']; while(q.length){ const x=q.shift(); for(const y of adj[x]||[]) if(!seen.has(y)){ seen.add(y); q.push(y); } }
  const cut=ROOMS.filter(r=>!seen.has(r.id)).map(r=>r.name); if(cut.length && (MAP.bridges||[]).length) issues.push('출발점과 이어지지 않은 장소: '+cut.join(', '));
  // 의존 그래프: 단계 f → f+1 → … → 최종. 단계는 앞으로만 가고 퍼즐 대는 풀면 반드시 비워지므로 순환 대기가 생기지 않음
  return issues;
}

/* 지표 모으기 (P0-3) — 난수를 쓰지 않음 */
let MET=null;
function metReset(){ MET = FUN_ON&&FUN.metrics ? {dwell:teams.map(()=>({})), wait:teams.map(()=>({})), hint:teams.map(()=>({})), wrong:teams.map(()=>({})), moves:teams.map(()=>0), lastF:teams.map(()=>null)} : null; }
function metTick(dt){
  if(!MET) return;
  for(const a of agents){ const d=MET.dwell[a.team.idx]; d[a.room]=(d[a.room]||0)+dt/a.team.members.length; }
  for(const t of teams) if(t.state==='waiting' && t.waitRoom){ const w=MET.wait[t.idx]; w[t.waitRoom]=(w[t.waitRoom]||0)+dt; }
}
function metTier(t,st){ if(!MET) return; const f=st.room.f; if(MET.lastF[t.idx]!==null && MET.lastF[t.idx]!==f) MET.moves[t.idx]++; MET.lastF[t.idx]=f; }
function metCount(kind,t,puz){ if(!MET) return; const o=MET[kind][t.idx]; o[puz]=(o[puz]||0)+1; }
function metSnapshot(){
  if(!MET) return null;
  return {rooms:ROOMS.map(r=>({id:r.id,name:r.name,f:r.final?'최종':(r.start?'출발':tierName(r.f))})), teams:teams.map(t=>({name:t.name,
    dwell:MET.dwell[t.idx], wait:MET.wait[t.idx], hint:MET.hint[t.idx], wrong:MET.wrong[t.idx], moves:MET.moves[t.idx],
    solved:Object.fromEntries((t.record||[]).map(x=>[x.room,x.puzzle])) }))};
}
const BOTTLENECK_SEC=120;
function metricsCSV(r){
  const m=r.metrics, q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const head=['팀','장소','단계','체류(초·팀원 평균)','대기(초)','병목(대기 '+BOTTLENECK_SEC+'초 이상이면 Fail)','푼 퍼즐','힌트 요구','오답','층간 이동(팀 합계)'];
  const rows=[];
  for(const t of m.teams){
    for(const rm of m.rooms){
      const dw=Math.round(t.dwell[rm.id]||0), wt=Math.round(t.wait[rm.id]||0); const pz=t.solved[rm.name]||'';
      const puzzles=(SCN&&SCN.rooms[rm.id]&&SCN.rooms[rm.id].puzzles||[]).map(p=>p[0]);
      const hi=puzzles.reduce((s,p)=>s+(t.hint[p]||0),0), wr=puzzles.reduce((s,p)=>s+(t.wrong[p]||0),0);
      if(!dw && !wt && !pz) continue;
      rows.push([t.name,rm.name,rm.f,dw,wt,wt>=BOTTLENECK_SEC?'Fail':'Pass',pz,hi,wr,'']);
    }
    const sum=(o)=>Math.round(Object.values(o).reduce((a,b)=>a+b,0));
    rows.push([t.name,'(팀 합계)','',sum(t.dwell),sum(t.wait),sum(t.wait)>=BOTTLENECK_SEC?'Fail':'Pass',Object.keys(t.solved).length+'개',sum(t.hint),sum(t.wrong),t.moves]);
  }
  return '﻿'+head.map(q).join(',')+'\n'+rows.map(x=>x.map(q).join(',')).join('\n');
}

/* 엔딩 (P1-2): 성공 / 시간 초과 / 정체(대기가 제한 시간의 stuckWait 이상이거나 단서 1개 이하) */
function endingOf(t){
  if(t.finish!==null) return 'success';
  return (t.waitTotal>=LIMIT*FUN.stuckWait || t.clues<=1) ? 'stuck' : 'timeout';
}
const END_LABEL={success:'성공', timeout:'시간 초과', stuck:'정체'};
const endLabel=e=>(FUN.endLabels&&FUN.endLabels[e])||END_LABEL[e];

/* 히트맵 (P1-3) — 별마다 바닥 원판 색: 파랑(적게 머묾) → 노랑 → 빨강(오래 머묾) */
let heatOn=false, heatDiscs=[];
function buildHeat(){
  heatDiscs.forEach(d=>d.parent&&d.parent.remove(d)); heatDiscs=[];
  if(!(FUN_ON&&FUN.heatmap)) return;
  for(const r of ROOMS){ const m=new THREE.MeshBasicMaterial({color:0x3366ff,transparent:true,opacity:.6,depthWrite:false,toneMapped:false,polygonOffset:true,polygonOffsetFactor:-8,polygonOffsetUnits:-8});
    const d=new THREE.Mesh(new THREE.CircleGeometry(r.r*.92,40),m); d.rotation.x=-Math.PI/2; d.position.set(r.x,r.y+.09,r.z); d.renderOrder=4; d.visible=false; d.raycast=()=>{}; d.userData.room=r.id; worldRoot.add(d); heatDiscs.push(d); }
}
const _hc=new THREE.Color();
function updateHeat(){
  if(!heatOn||!MET) return;
  const tot={}; MET.dwell.forEach(o=>{ for(const k in o) tot[k]=(tot[k]||0)+o[k]; });
  const mx=Math.max(1,...Object.values(tot));
  for(const d of heatDiscs){ const v=(tot[d.userData.room]||0)/mx; _hc.setHSL((1-v)*.62,.9,.5); d.material.color.copy(_hc); d.visible=true; }
}
function setHeat(on){ heatOn=on&&heatDiscs.length>0; heatDiscs.forEach(d=>d.visible=false); if(heatOn) updateHeat(); }

/* 여행 일지 (P1-1) — 기록(events)으로 문장을 새로 만듦. CSV·텍스트 원본은 그대로 */
function journalHTML(r){
  if(!r.journal) return '<p class="muted">이 기록에는 여행 일지 정보가 없어요.</p>';
  const J=r.journal, mm=s=>Math.max(1,Math.round(s/60))+'분', nm=x=>String(x||'').replace(/\s*\([^)]*\)\s*$/,''), jo=(w,a,b)=>esc(josa(nm(w),a,b));
  return J.teams.map(t=>{
    const lines=[`<b style="color:${t.color}">${esc(t.name)}</b> — ${esc(t.members.join(', '))}`];
    lines.push(`${jo(J.start,'을','를')} 떠났어요.`);
    for(const x of t.steps){
      if(x.k==='go') lines.push(`${mm(x.s)}째, ${esc(nm(x.room))}에 닿아 「${esc(x.puzzle)}」에 매달렸어요.`);
      else if(x.k==='wait') lines.push(`다른 팀이 자리를 쓰고 있어 ${esc(nm(x.room))}에서 ${mm(x.w)} 동안 기다렸어요.`);
      else if(x.k==='hint') lines.push(`막혀서 힌트를 하나 꺼냈어요${x.trade?' (시간을 내주고 더 큰 힌트를 받았어요)':''}.`);
      else if(x.k==='wrong') lines.push(`답을 맞혀 봤지만 틀렸어요. 다시 처음부터 살펴봤어요.`);
      else if(x.k==='delay') lines.push(x.tier?`${esc(nm(x.room))}까지 ${jo(J.link||'길','을','를')} ${/다리/.test(J.link||'')?'건너느라':'따라오느라'} 시간이 걸렸어요.`:`${jo(x.room,'을','를')} 한참 둘러본 뒤에야 실마리가 보였어요.`);
      else if(x.k==='solve') lines.push(`${esc(x.finder)}의 눈썰미로 ${jo(J.clue,'을','를')} 얻었어요 (${x.n}/${J.total}).${x.card?` <span class="muted">— ${esc(J.cardName||'카드')}: “${esc(x.card)}”</span>`:''}`);
      else if(x.k==='escape') lines.push(`${mm(x.s)}째, ${jo(x.finder,'이가','가')} 마지막 「${esc(x.puzzle)}」까지 풀었어요.`);
    }
    if(t.ending) lines.push(`<i>${esc(t.ending)}</i>`);
    return `<div class="jr">${lines.map(l=>`<p>${l}</p>`).join('')}</div>`;
  }).join('');
}

let camGoal=null;
function aimCamera(){
  if(!PLANETS.length){ camGoal={t:new THREE.Vector3(0,4,-42),p:new THREE.Vector3(0,70,40)}; return; }
  const narrow=innerWidth<innerHeight, k=narrow?1.5:1;
  let ps = focus==='all'?PLANETS : focus==='vault'? PLANETS.filter(p=>p.final) : PLANETS.filter(p=>p.f===+focus && !p.final);
  if(!ps.length) ps=PLANETS;
  const c=new THREE.Vector3(); ps.forEach(p=>c.add(new THREE.Vector3(p.x,p.y,p.z))); c.multiplyScalar(1/ps.length);
  let sp=0; ps.forEach(p=>sp=Math.max(sp,Math.hypot(p.x-c.x,p.z-c.z)+p.r));
  const d=(focus==='all'? sp*1.25 : sp*1.5+10)*k;
  camGoal={t:c.clone(), p:new THREE.Vector3(c.x, c.y+d*.8, c.z+d*.75)};
}

/* ================= Render loop ================= */
let last=performance.now(), uiTimer=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000); last=now;
  if(running && !ended){
    acc+=rdt*GS_PER_S*speed;
    while(acc>=.5 && !ended){ tickSim(.5); acc-=.5; }
  } else if(ended){ const s=rdt*GS_PER_S*speed; agents.forEach(a=>stepAgent(a,s)); }
  const t=now/1000; if(ANIM.length) animWorld(t);
  agents.forEach(a=>{
    const m=a.mesh;
    m.position.set(a.x, a.f, a.z);
    m.rotation.y=a.yaw;
    const anim = a.walking && running ? Math.sin(t*9*Math.min(3,speed)+a.phase) : 0;
    a.legs[0].rotation.x=anim*.5; a.legs[1].rotation.x=-anim*.5;
    a.arms[0].rotation.x=-anim*.4; a.arms[1].rotation.x=anim*.4;
    let hop=0;
    if(a.team.state==='escaped' && !a.walking) hop=Math.max(0,Math.sin(t*6+a.phase))*.25;
    if(a.jump!==undefined && clock-a.jump<20) hop=Math.max(hop,Math.abs(Math.sin(t*8))*.3);
    m.position.y+=hop;
    a.ring.scale.setScalar(selected===a?1.6:1);
  });
  teams.forEach(tm=>{
    let cx=0,cy=0,cz=0; tm.members.forEach(m=>{cx+=m.mesh.position.x;cy+=m.mesh.position.y;cz+=m.mesh.position.z;});
    const n=tm.members.length; tm.tag.position.set(cx/n, cy/n+2.6, cz/n);
    let txt=tm.name;
    if(tm.state==='waiting') txt+=' ⏳ 대기 '+fmt(clock-(tm.waitStart??clock));
    else if(tm.state==='solving') txt+=' 🔍 '+Math.min(99,Math.floor(tm.progress*100))+'%';
    else if(tm.state==='moving') txt+=' → 이동';
    else if(tm.state==='escaped') txt+=' '+DONE_ICON()+' '+DONE();
    else if(tm.state==='failed') txt+=' ✖ 실패';
    if(txt!==tm.tagText){ tm.tagText=txt; const old=tm.tag.material.map; const nl=label(txt,3.6,'#ffffff',tm.css); tm.tag.material.map=nl.material.map; tm.tag.scale.copy(nl.scale); old.dispose(); }
  });
  updateBubbles(); updateZones(t); if(heatOn && (frame._h=(frame._h||0)+1)%20===0) updateHeat();
  updateDayCycle();
  if(camGoal){ const k=1-Math.exp(-rdt*5); controls.target.lerp(camGoal.t,k); camera.position.lerp(camGoal.p,k); if(camera.position.distanceTo(camGoal.p)<.5) camGoal=null; }
  controls.update();
  uiTimer+=rdt;
  if(uiTimer>.25){ uiTimer=0;
    const left=LIMIT-clock, ck=document.getElementById('clock'); ck.textContent=fmt(left); ck.classList.toggle('warn',left<600);
    renderTeams(); if(selected) showWho(selected);
  }
  if(!window.__noDraw) renderer.render(scene,camera);
  requestAnimationFrame(frame);
}


/* ================= 낮과 밤 (게임 시간 60분 = 하루 24시간) ================= */
let DC=null;
function setupDayCycle(){
  const th=MAP.theme||{}, sk=th.sky;
  DC={start:MAP.startHour??9, fixed:!!th.fixedSky||!sk, sky:sk?sk.map(c=>new THREE.Color(hexNum(c))):null,
      hemiBase:hemi.intensity, sunBase:sun.intensity, sunCol:new THREE.Color(hexNum(th.sunColor??'#fff0d8')), moonCol:new THREE.Color(0x9fb4ff),
      lights:[], emis:[], stars:[], nightMin:th.nightHemi??.42};
  worldRoot.traverse(o=>{
    if(o.isPointLight) DC.lights.push([o,o.intensity]);
    if(o.isPoints) { o.material.transparent=true; DC.stars.push(o.material); }
    const m=o.material; if(m && m.emissive && m.emissiveIntensity>0 && (m.emissive.r+m.emissive.g+m.emissive.b)>0.3 && !DC.emis.some(e=>e[0]===m)) DC.emis.push([m,m.emissiveIntensity]);
  });
  if(MAP.winM && !DC.emis.some(e=>e[0]===MAP.winM)) DC.emis.push([MAP.winM,MAP.winM.emissiveIntensity]);
  const sunM=new THREE.Mesh(new THREE.SphereGeometry(11,24,16),new THREE.MeshBasicMaterial({color:0xfff2b0,fog:false}));
  const moonM=new THREE.Mesh(new THREE.SphereGeometry(7,24,16),new THREE.MeshBasicMaterial({color:0xf3f0e0,fog:false}));
  worldRoot.add(sunM,moonM); DC.sunM=sunM; DC.moonM=moonM;
  // 기존 장식용 달(테마 moon)은 움직이는 달로 대체
  worldRoot.children.forEach(c=>{ if(c!==moonM && c.isMesh && c.geometry.type==='SphereGeometry' && c.material.isMeshBasicMaterial && c.material.fog===false && c!==sunM) c.visible=false; });
}
function hourAt(sec){ return ((DC?.start??9) + sec/LIMIT*24)%24; }
function updateDayCycle(){
  if(!DC) return;
  const h=(window.__fixHour!=null?window.__fixHour:hourAt(clock)), a=(h-6)/12*Math.PI, e=Math.sin(a);           // 해 높이 (-1~1)
  const R=260, cx=0, cz=-44;
  const sp=new THREE.Vector3(cx+Math.cos(a)*R, Math.sin(a)*R*.8, cz-90+Math.sin(a)*20);
  const mp=new THREE.Vector3(cx-Math.cos(a)*R, -Math.sin(a)*R*.8, cz-90);
  DC.sunM.position.copy(sp); DC.moonM.position.copy(mp); DC.sunM.visible=e>-.05; DC.moonM.visible=e<.05;
  const night=smooth(.18,-.12,e);                                        // 0 낮 → 1 밤
  const day=smooth(-.05,.35,e);
  if(e>-.02){ sun.position.set(sp.x*.25, Math.max(8,sp.y*.25), sp.z*.25+30); sun.color.copy(DC.sunCol).lerp(new THREE.Color(0xff9a5a),1-smooth(.05,.4,e)); sun.intensity=DC.sunBase*Math.max(.15,day); }
  else { sun.position.set(mp.x*.25, Math.max(8,mp.y*.25), mp.z*.25+30); sun.color.copy(DC.moonCol); sun.intensity=DC.sunBase*.28; }
  hemi.intensity=DC.hemiBase*(DC.nightMin+(1-DC.nightMin)*(1-night));
  if(!DC.fixed){ const [cN,cD,cY]=DC.sky; const col=new THREE.Color(); if(e>.12) col.copy(cD).lerp(cY,smooth(.12,.4,e)); else col.copy(cN).lerp(cD,smooth(-.15,.12,e));
    scene.background.copy(col); scene.fog.color.copy(col); }
  for(const m of DC.stars) m.opacity = DC.fixed ? 1 : night;
  const lamp=.12+.88*night;                                              // 가로등·창문·실내등
  for(const [l,b] of DC.lights) l.intensity=b*(.25+.75*night);
  for(const [m,b] of DC.emis) m.emissiveIntensity=b*lamp;
  const el=document.getElementById('tod'); if(el){ const hh=Math.floor(h), mm=Math.floor((h-hh)*60); el.textContent=`${night>.6?'🌙':e<.25?'🌅':'☀️'} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }
}

function buildWorld(){
  worldRoot.children.slice().forEach(c=>{ disposeTree(c); worldRoot.remove(c); });

  buildTheme(MAP.theme||{});
  if(isTown()){
    MAP.winM=new THREE.MeshStandardMaterial({color:0x2a3440,emissive:hexNum(MAP.windowGlow||'#ffcf8a'),emissiveIntensity:MAP.windowGlowI??.6});
    MAP.trimM=mat2(hexNum(MAP.trimColor||'#6b4f3a'));
    computeDoors(); BRIDGES.forEach(([a,b])=>makeRoad(a,b)); PLANETS.forEach(makeBuilding); bridgeSegs.forEach(drawRoad); buildTerrain(); scatterTown(); buildExtras(); buildWater(); buildWonder();
  } else if(isStack()){
    MAP.winM=new THREE.MeshStandardMaterial({color:0x8fb8d0,emissive:0x000000}); MAP.trimM=mat2(hexNum(MAP.trimColor||'#3b4249'));
    computeDoors(); BRIDGES.forEach(([a,b])=>makeRoad(a,b)); PLANETS.forEach(makeBuilding); bridgeSegs.forEach(drawStackLink); buildStackShell();
  } else { PLANETS.forEach(makePlanet); BRIDGES.forEach(([a,b])=>makeBridge(a,b)); }
  if(LOWPOWER){ let n=0; worldRoot.traverse(o=>{ if(o.isPointLight){ n++; if(n>4) o.visible=false; } }); }
  buildStations(); initNav(); setupDayCycle(); updateDayCycle();
  applyInk(worldRoot, true);
  syncFunUI(); if(FUN_ON){ const iss=validateScenario(); if(iss.length){ console.warn('시나리오 점검',iss); setTimeout(()=>toast('시나리오 점검: '+iss[0]),800); } }

}
const lockedSpecial=id=>['library','human-acts','dadada'].includes(id);
function loadMap(id,quiet){
  const e=MAPS.find(m=>m.id===id&&!m.href&&!lockedSpecial(m.id))||MAPS.find(m=>!m.href&&!lockedSpecial(m.id));
  running=false; MAP=e.map;

  PLANETS=MAP.planets.map(p=>({...p,top:hexNum(p.top),rock:hexNum(p.rock)})); BRIDGES=MAP.bridges; PL=Object.fromEntries(PLANETS.map(p=>[p.id,p]));
  applyScenario(sc); buildWorld(); newGame(sc.defaultSeed||7);
  for(const sid of ['scnSel','scnSel2']){ const el=document.getElementById(sid);
    el.innerHTML=MAPS.map(m=>`<option value="${m.id}"${lockedSpecial(m.id)?' disabled':''}>${m.title}</option>`).join(''); el.value=e.id; el.onchange=()=>{ const m=MAPS.find(x=>x.id===el.value); if(m&&lockedSpecial(m.id)){ el.value=e.id; return; } if(m&&m.href){ location.href=m.href; el.value=e.id; } else loadMap(el.value); }; }

  const vs=document.getElementById('viewSel'); vs.innerHTML=`<option value="all">보기: 전체</option>`+TIER_IDX().map(f=>`<option value="${f}">보기: ${tierName(f)}</option>`).join('')+`<option value="vault">보기: ${roomById.vault.short}</option>`+(isTown()?'<option value="roof">보기: 외관(지붕)</option>':'');
  focus='all'; vs.value='all'; roofs.forEach(r=>r.visible=!!MAP.roofGhost); if(MAP.roofGhost) setRoofMode(false); aimCamera();
  if(document.getElementById('rules').style.display==='flex') showRules();
  if(!quiet && window.TodakPoster) TodakPoster.show({id:e.id,custom:!!e.custom,scenario:SCN,base:'../../',maps:MAPS.map(m=>({id:m.id,title:m.title})),
    onStart:()=>{ document.getElementById('rules').style.display='none'; startRun(); }, onRules:()=>showRules(),
    onPick:pid=>{ const m=MAPS.find(x=>x.id===pid); if(!m||lockedSpecial(m.id)) return; if(m.href) location.href=m.href; else loadMap(pid); }});

const gv=id=>{ const el=document.getElementById(id); return el?(el.type==='checkbox'?el.checked:el.value):undefined; };
function collectEditor(){
  const e=edEntry, sc=e.scenario, mp=e.map;
  if(edTab==='story'){
    e.title=gv('e_title')||e.title; sc.title=gv('e_stitle'); sc.subtitle=gv('e_sub');

    sc.clue=gv('e_clue')||sc.clue; sc.finalThing=gv('e_fin')||sc.finalThing; sc.doneWord=gv('e_done')||sc.doneWord; sc.doneIcon=gv('e_icon')||sc.doneIcon;
    sc.teams.forEach((t,i)=>{ t.name=gv('e_tn'+i)||t.name; t.color=gv('e_tc'+i)||t.color; });
    const tiers=TIER_IDX().map(f=>gv('e_tier'+f)); if(tiers.some(Boolean)) mp.tiers=tiers.map((t,f)=>t||(mp.tiers||[])[f]||`${f+1}단계`);
  } else if(edTab==='rooms'){
    const newP={};
    for(const id of roomIds()){ const r=sc.rooms[id]; if(!r) continue; const nm=gv('e_rn_'+id); if(nm){ r.name=nm; if(mp.roomNames&&mp.roomNames[id]!==undefined) mp.roomNames[id]=nm; if(id==='vault') r.short=nm.replace(/\s*\(.*\)/,''); }
      (r.puzzles||[]).forEach((pz,k)=>{ let n=(gv(`e_pn_${id}_${k}`)||pz[0]).trim(); while(newP[n]) n+=' ʹ'; pz[0]=n; pz[1]=gv(`e_pt_${id}_${k}`)||pz[1];
        newP[n]={desc:gv(`e_pd_${id}_${k}`)||'',answer:gv(`e_pa_${id}_${k}`)||'',hints:[0,1,2].map(j=>gv(`e_ph_${id}_${k}_${j}`)||'')}; }); }
    sc.puzzles=newP;
  } else if(edTab==='map'){
    const hr=+gv('e_hour'); if(!isNaN(hr)) mp.startHour=Math.max(0,Math.min(23,hr)); if(gv('e_roof')) mp.roofStyle=gv('e_roof');
    for(const p of mp.planets){ const n=k=>{ const v=parseFloat(gv(k+p.id)); return isNaN(v)?undefined:v; };
      p.x=n('e_mx_')??p.x; p.z=n('e_mz_')??p.z; p.y=n('e_my_')??p.y; p.r=Math.max(4,Math.min(14,n('e_mr_')??p.r)); p.decor=gv('e_md_'+p.id)||p.decor; p.top=gv('e_mc_'+p.id)||p.top;

  }

function openHistory(){
  const h=LS.get('escHistory',[]), body=document.getElementById('histBody');
  body.innerHTML=h.length?h.map((r,i)=>{ const w=r.ranking.find(t=>t.rank===1); return `<div class="hi"><div><b>${esc(r.title)}</b><div class="muted">${new Date(r.at).toLocaleString('ko-KR')} · 시드 ${r.seed} · 1위 ${w?esc(w.team)+' '+w.time:'없음'}</div></div><div class="row"><button data-hv="${i}">보기</button><button data-hd="${i}" class="danger">지우기</button></div></div>`; }).join(''):'<p class="muted">아직 저장된 기록이 없어요. 게임이 끝나면 자동으로 저장돼요.</p>';
  body.querySelectorAll('[data-hv]').forEach(b=>b.onclick=()=>showRecord(h[+b.dataset.hv]));
  body.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{ h.splice(+b.dataset.hd,1); LS.set('escHistory',h); openHistory(); });
  document.getElementById('history').style.display='flex';
}
let curRec=null;
function showRecord(r){ curRec=r; document.getElementById('recTitle').textContent=r.title; document.getElementById('recBody').innerHTML=recHTML(r); document.getElementById('recView').style.display='flex';
  const row=document.querySelector('#recView .row');
  let jb=document.getElementById('recJournal'); if(!jb){ jb=document.createElement('button'); jb.id='recJournal'; row.insertBefore(jb,row.firstChild); }
  let mb=document.getElementById('recMetrics'); if(!mb){ mb=document.createElement('button'); mb.id='recMetrics'; mb.textContent='📈 지표 CSV'; row.insertBefore(mb,document.getElementById('recShare')); }
  jb.style.display=r.journal?'':'none'; mb.style.display=r.metrics?'':'none';
  let jv=false; jb.textContent='📖 여행 일지';
  jb.onclick=()=>{ jv=!jv; document.getElementById('recBody').innerHTML=jv?journalHTML(r):recHTML(r); jb.textContent=jv?'📋 시간대별 기록':'📖 여행 일지'; };
  mb.onclick=()=>downloadFile(`${r.title}_${r.at.slice(0,16).replace(/[:T]/g,'-')}_지표.csv`.replace(/[\\/:*?"<>|\s]/g,'_'),metricsCSV(r),'text/csv;charset=utf-8'); }
function currentRecord(){ const e=curEntry(); const ranked=teams.slice().sort((a,b)=>(a.finish??1e9)-(b.finish??1e9)||b.clues-a.clues);
  const r={at:new Date().toISOString(),title:e?e.title:SCN.title,seed:SEED,reason:endReason||('진행 중 · 경과 '+fmt(clock)),ranking:ranked.map((t,i)=>({rank:t.finish!==null?i+1:null,team:t.name,color:t.css,time:t.finish!==null?fmt(t.finish):null,clues:t.clues,hints:t.hints,mvp:t.members.slice().sort((a,b)=>b.contrib-a.contrib)[0].name,members:t.members.map(m=>m.name)})),events:events.map(x=>({t:x.t,team:x.team,text:x.text,detail:x.detail}))}; funRecord(r); return r; }
function bindAppUI(){
  document.querySelectorAll('#edTabs button').forEach(b=>b.onclick=()=>{ collectEditor(); edTab=b.dataset.t; renderEditor(); });
  document.getElementById('edApply').onclick=()=>applyEditor(false);
  document.getElementById('edSave').onclick=()=>applyEditor(true);
  document.getElementById('edClose').onclick=()=>document.getElementById('editor').style.display='none';
  document.getElementById('histClose').onclick=()=>document.getElementById('history').style.display='none';
  document.getElementById('recClose').onclick=()=>document.getElementById('recView').style.display='none';
  const nm=()=>`${curRec.title}_${curRec.at.slice(0,16).replace(/[:T]/g,'-')}`.replace(/[\\/:*?"<>|\s]/g,'_');
  document.getElementById('recTxt').onclick=()=>downloadFile(nm()+'.txt',recText(curRec),'text/plain;charset=utf-8');
  document.getElementById('recCsv').onclick=()=>downloadFile(nm()+'.csv',recCSV(curRec),'text/csv;charset=utf-8');
  document.getElementById('recPdf').onclick=()=>{ document.body.classList.add('printing'); setTimeout(()=>{ window.print(); setTimeout(()=>document.body.classList.remove('printing'),500); },100); };
  document.getElementById('recShare').onclick=async()=>{ const t=recText(curRec); try{ if(navigator.share) await navigator.share({title:curRec.title,text:t}); else { await navigator.clipboard.writeText(t); toast('복사했어요'); } }catch(_){ } };
}

async function cacheAll(){
  if(!('caches' in window)){ alert('이 브라우저는 오프라인 저장을 지원하지 않아요.'); return; }
  const base=new URL('../../',location.href).href, here=new URL('./',location.href).href;
  const urls=[base+'index.html',base+'manifest.json',base+'icon-192.png',base+'icon-512.png',base+'scenarios/index.json',here+'index.html',here+'maps/index.json',
    'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js','https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js'];
  urls.push(base+'poster.js'); urls.push(base+'counter.js'); if(window.TodakPoster) Object.keys(TodakPoster.data).forEach(k=>urls.push(base+'posters/'+k+'.jpg'));
  try{ const bi=await (await fetch(base+'scenarios/index.json')).json(); (bi.scenarios||[]).forEach(x=>urls.push(base+'scenarios/'+x.file)); }catch(_){}
  try{ const mi=await (await fetch(here+'maps/index.json')).json(); (mi.maps||[]).forEach(m=>{ if(m.map) urls.push(here+m.map); if(m.scenario) urls.push(here+m.scenario); }); }catch(_){}
  const c=await caches.open('escape-sim-v1'); let ok=0;
  for(const u of urls){ try{ const r=await fetch(u,{cache:'reload'}); if(r.ok){ await c.put(u,r.clone()); ok++; } }catch(_){} toast(`저장 중… ${ok}/${urls.length}`); }
  LS.set('escOffline',{at:new Date().toISOString(),n:ok});
  toast(ok===urls.length?`인터넷 없이 쓸 준비가 됐어요 (${ok}개 파일)`:`${ok}/${urls.length}개만 저장했어요. 인터넷이 될 때 다시 눌러 주세요`);
}
async function init(){
  try{
    const idx=await (await fetch('maps/index.json')).json();
    MAPS=await Promise.all(idx.maps.map(async m=> m.href ? ({id:m.id,title:m.title,href:m.href}) : ({id:m.id,title:m.title,map:await (await fetch(m.map)).json(),scenario:await (await fetch(m.scenario)).json()})));
  }catch(e){ document.getElementById('scnSel').innerHTML='<option>맵을 불러오지 못했어요</option>'; console.error(e); return; }
  applyLocalEdits(); bindAppUI();
  const want=location.hash.slice(1), wl=MAPS.find(m=>m.id===want&&m.href&&!lockedSpecial(m.id)); if(wl){ location.href=wl.href; return; }
  loadMap(MAPS.some(m=>m.id===want&&!m.href)?want:MAPS.find(m=>!m.href).id);
  camera.position.copy(camGoal.p); controls.target.copy(camGoal.t); camGoal=null;
}
addEventListener('hashchange',()=>{ const id=location.hash.slice(1), m=MAPS.find(x=>x.id===id); if(!m||!MAP) return; if(lockedSpecial(id)){ const current=MAPS.find(x=>x.map===MAP); if(current) history.replaceState(null,'','#'+current.id); return; } if(m.href){ location.href=m.href; return; } if(m.map!==MAP) loadMap(id); });
resize(); aimCamera(); camera.position.copy(camGoal.p); controls.target.copy(camGoal.t); camGoal=null;
requestAnimationFrame(frame);
init();
window.__segs=()=>bridgeSegs.map(s=>s.from+'-'+s.to+':'+(s.pier?'P':'R')).join(' ');
window.__teams=()=>teams; window.__cam3=camera; window.__scene=scene; window.__renderer=renderer;
window.__fun={validate:()=>validateScenario(), get:()=>FUN, on:()=>FUN_ON, metrics:()=>metSnapshot(), journal:()=>journalSnapshot(), csv:()=>metricsCSV({metrics:metSnapshot()}), record:()=>currentRecord(), journalHTML:()=>journalHTML(currentRecord()), result:()=>{ const r=teams.slice().sort((a,b)=>(a.finish??1e9)-(b.finish??1e9)||b.clues-a.clues); return funResultHTML(r); }, set:(o)=>{ LS.set(funKey(),o); loadFun(); syncFunUI(); }, daily:dailySeed};
window.__toonIcons=()=>{ const kinds=[['obs',.6],['logic',.35],['both',.85],['search'],['hint'],['check'],['wait'],['angry'],['star'],['x'],['alert']];
  const out=document.createElement('canvas'); out.width=128*kinds.length; out.height=128; const x=out.getContext('2d');
  kinds.forEach((k,i)=>{ const s=makeBubble(); drawBubble(s,k[0],k.length>1?k[1]:null); x.drawImage(s.userData.c,i*128,0); });
  ['obs','logic','both'].forEach((k)=>{}); return out.toDataURL(); };
window.__hideSprites=()=>{ window.__spritesOff=true; scene.traverse(o=>{ if(o.isSprite) o.visible=false; }); agents.forEach(a=>{ if(a.team&&a.team.tag) a.team.tag.visible=false; }); };
window.__sim={tick:(n)=>{ for(let i=0;i<n;i++) tickSim(.5); }, get:()=>({agents,teams,events,clock,ended,stations}), start:()=>{ running=true; }, setSpeed:(x)=>speed=x, newGame, loadMap, cam:(px,py,pz,tx,ty,tz)=>{ camGoal=null; camera.position.set(px,py,pz); controls.target.set(tx,ty,tz); controls.update(); }};
</script>
